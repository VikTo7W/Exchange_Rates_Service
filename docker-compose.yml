version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rates
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  rates:
    build: .
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rates
      DB_USER: rates
      DB_PASSWORD: rates
    ports:
      - "8080:8080"

volumes:
  db-data:
