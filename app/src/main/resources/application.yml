spring:
  application:
    name: rates-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rates}
    username: ${DB_USER:rates}
    password: ${DB_PASSWORD:rates}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s
    requested-heartbeat: 30s


rabbitmq:
  rates:
    exchange: rates.exchange
    routing-key: rates.*
    queues:
      - rates.cache.queue
      - rates.analytics.queue
      - rates.audit.queue

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  internal-token: local-token
